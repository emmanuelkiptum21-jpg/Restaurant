    <section class="contact-section">
  <div class="container">
    <h2>Contact Our Restaurant</h2>
    <p>Have questions or feedback? We'd love to hear from you!</p>

    <form id="contact-form">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
      </div>

      <div class="form-group">
        <label for="email">Gmail</label>
        <input type="email" id="email" name="email" placeholder="Enter your Gmail address" required>
      </div>

      <div class="form-group">
        <label for="comment">Message</label>
        <textarea id="comment" name="comment" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit">Send Message</button>

    </form>
  </div>
</section>
